[package]
name = "hc-tui"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-native-roots"] }
urlencoding = "2.1"
toml = "1"
zeroize = "1"
